spring.application.name=atelier-backend

# Perfil por defecto para desarrollo local. Cambia con SPRING_PROFILES_ACTIVE en producción.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Base de datos (PostgreSQL) ---
# La contraseña real vive en application-local.properties (ignorada por git).
# En producción se inyecta por variable de entorno.
#
# Desarrollo local (por defecto):
#   POSTGRES_URL=jdbc:postgresql://127.0.0.1:5432/atelier
#
# Supabase: la URL lleva SSL obligatorio y el usuario depende del modo de
# conexión. Ver README, sección "Supabase". Nunca usar el puerto 6543 con
# Hibernate/Flyway: ese modo no soporta prepared statements.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/atelier}
spring.datasource.username=${POSTGRES_USER:atelier}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# El esquema lo gestiona Flyway (db/migration). Hibernate solo valida que las
# entidades coincidan con las tablas; nunca crea ni altera columnas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- Proveedores de IA independientes ---
# Gemini conversa y redacta texto; Pollinations crea y edita imágenes.
atelier.ia.url=${GEMINI_URL:}
atelier.ia.api-key=${GEMINI_API_KEY:}
atelier.ia.modelo-texto=${GEMINI_MODELO_TEXTO:gemini-3.8-flash}
atelier.ia.modelo-imagen=${POLLINATIONS_MODELO_IMAGEN:microsoft/mai-image-2.6-flash}
atelier.ia.timeout-segundos=${IA_TIMEOUT_SEGUNDOS:120}
atelier.ia.directorio-imagenes=${IA_DIRECTORIO_IMAGENES:imagenes-diseno}
atelier.ia.url-imagen=${POLLINATIONS_URL:https://gen.pollinations.ai/v1}
atelier.ia.api-key-imagen=${POLLINATIONS_API_KEY:}

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# Supabase usa "public" como esquema por defecto; fijarlo explícitamente hace
# que el historial de migraciones caiga siempre en el mismo sitio, tanto en
# Postgres local como en Supabase.
spring.flyway.schemas=public
spring.flyway.default-schema=public

# --- Seguridad ---
# Credenciales del usuario HTTP Basic. En producción usar SPRING_SECURITY_USER_PASSWORD.
spring.security.user.name=${API_USER:atelier}
spring.security.user.password=${API_PASSWORD:}

# --- Actuator (solo health e info expuestos) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
