spring.application.name=atelier-backend

# Perfil por defecto para desarrollo local. Cambia con SPRING_PROFILES_ACTIVE en producción.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Base de datos (PostgreSQL, motor propuesto en el README) ---
# La contraseña real vive en application-local.properties (ignorada por git).
# En producción se inyecta por variable de entorno.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/atelier}
spring.datasource.username=${POSTGRES_USER:atelier}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# El esquema lo gestiona Flyway (db/migration). Hibernate solo valida que las
# entidades coincidan con las tablas; nunca crea ni altera columnas.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- Puente de IA (README: "API REST (Spring Boot) --> Gateway IA --> Modelos Qwen") ---
# Mientras atelier.ia.url este vacia, el backend funciona sin IA: la viabilidad
# y el stock se calculan igual, solo cambia que el texto no lo redacta el modelo.
# Al apuntar la URL a un servidor compatible con OpenAI (vLLM, Ollama, LM Studio
# o el gateway de Django) se habilitan el prompt y las imagenes de diseno.
atelier.ia.url=${IA_URL:}
atelier.ia.api-key=${IA_API_KEY:}
atelier.ia.modelo-texto=${IA_MODELO_TEXTO:Qwen3.6-35B-A3B}
atelier.ia.modelo-imagen=${IA_MODELO_IMAGEN:Qwen-Image}
atelier.ia.timeout-segundos=${IA_TIMEOUT_SEGUNDOS:120}
atelier.ia.directorio-imagenes=${IA_DIRECTORIO_IMAGENES:imagenes-diseno}

# --- Flyway ---
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Seguridad ---
# Credenciales del usuario HTTP Basic. En producción usar SPRING_SECURITY_USER_PASSWORD.
spring.security.user.name=${API_USER:atelier}
spring.security.user.password=${API_PASSWORD:}

# --- Actuator (solo health e info expuestos) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
