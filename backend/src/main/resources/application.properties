spring.application.name=atelier-backend

# Perfil por defecto para desarrollo local. Cambia con SPRING_PROFILES_ACTIVE en producción.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- Base de datos (PostgreSQL, motor propuesto en el README) ---
# La contraseña real vive en application-local.properties (ignorada por git).
# En producción se inyecta por variable de entorno.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://127.0.0.1:5432/atelier}
spring.datasource.username=${POSTGRES_USER:atelier}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# --- Seguridad ---
# Credenciales del usuario HTTP Basic. En producción usar SPRING_SECURITY_USER_PASSWORD.
spring.security.user.name=${API_USER:atelier}
spring.security.user.password=${API_PASSWORD:}

# --- Actuator (solo health e info expuestos) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
